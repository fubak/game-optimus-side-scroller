name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Level layout report
        run: npx vite-node scripts/levelReport.ts

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e
        env:
          # Use Playwright's own Chromium in CI rather than a system Chrome path.
          PLAYWRIGHT_USE_SYSTEM_CHROME: '0'

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
