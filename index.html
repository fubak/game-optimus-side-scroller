<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>OPTIMUS: RED PROTOCOL</title>
    <style>
      :root {
        --bg: #06070a;
        --cyan: #3fe9ff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: var(--bg);
        overflow: hidden;
        /* The game owns all input; stop the browser from hijacking gestures. */
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #stage {
        position: fixed;
        inset: 0;
        display: block;
      }
      #view {
        display: block;
        width: 100%;
        height: 100%;
        /* Crisp scaling: the renderer already resolves at the right internal
           resolution, so the browser must not add its own smoothing pass. */
        image-rendering: auto;
      }
      #boot {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 1.25rem;
        justify-items: center;
        font: 500 13px/1.6 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        letter-spacing: 0.22em;
        color: #7c8899;
        text-transform: uppercase;
        background: radial-gradient(ellipse at 50% 45%, #12161d 0%, #06070a 70%);
        transition: opacity 0.5s ease;
      }
      #boot.hidden {
        opacity: 0;
        pointer-events: none;
      }
      #boot .mark {
        font-size: 22px;
        letter-spacing: 0.4em;
        color: #e8eef5;
        font-weight: 300;
      }
      #boot .mark b {
        color: var(--cyan);
        font-weight: 600;
      }
      #boot .bar {
        width: 240px;
        height: 2px;
        background: #1b2029;
        overflow: hidden;
      }
      #boot .bar i {
        display: block;
        height: 100%;
        width: 30%;
        background: var(--cyan);
        box-shadow: 0 0 12px var(--cyan);
        animation: sweep 1.15s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      @keyframes sweep {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(333%);
        }
      }
      #boot .err {
        max-width: 34rem;
        text-align: center;
        color: #ff6b6b;
        letter-spacing: 0.08em;
        text-transform: none;
        font-size: 12px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="view"></canvas></div>
    <div id="boot">
      <div class="mark">OPTIMUS<b>:</b> RED PROTOCOL</div>
      <div class="bar"><i></i></div>
      <div class="status">initialising</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
