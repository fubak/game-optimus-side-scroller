<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <meta
      name="description"
      content="Optimus — a side-scrolling platformer about a humanoid factory robot escaping a decaying robotics plant."
    />
    <title>OPTIMUS — side-scroller</title>
    <!-- Absolute share URLs: crawlers (X, Discord, Slack, …) resolve against the live Pages site. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OPTIMUS" />
    <meta property="og:title" content="OPTIMUS — Escape the Assembly" />
    <meta
      property="og:description"
      content="A free browser side-scroller: climb a decaying robotics plant as a humanoid factory robot."
    />
    <meta property="og:url" content="https://fubak.github.io/game-optimus-side-scroller/" />
    <meta property="og:image" content="https://fubak.github.io/game-optimus-side-scroller/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OPTIMUS — Escape the Assembly: a factory robot on industrial platforms" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OPTIMUS — Escape the Assembly" />
    <meta
      name="twitter:description"
      content="A free browser side-scroller: climb a decaying robotics plant as a humanoid factory robot."
    />
    <meta name="twitter:image" content="https://fubak.github.io/game-optimus-side-scroller/og.png" />
    <meta name="twitter:image:alt" content="OPTIMUS — Escape the Assembly: a factory robot on industrial platforms" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%230b0e14'/%3E%3Crect x='4' y='3' width='8' height='6' rx='1' fill='%23d7dce5'/%3E%3Crect x='5' y='5' width='6' height='2' fill='%2337c9ff'/%3E%3Crect x='6' y='9' width='4' height='4' fill='%239aa4b5'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05070c;
        overflow: hidden;
        font-family: ui-monospace, 'SFMono-Regular', 'Menlo', 'Consolas', monospace;
        color: #d7dce5;
      }
      #app {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        touch-action: none;
      }
      canvas#screen {
        display: block;
        image-rendering: pixelated;
        background: #0b0e14;
        box-shadow:
          0 0 0 1px #1b2130,
          0 18px 60px rgb(0 0 0 / 70%);
      }
      #nojs {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        text-align: center;
        line-height: 1.6;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
      }
    </style>
  </head>
  <body>
    <h1 class="visually-hidden">Optimus — side-scrolling platformer</h1>
    <div id="app">
      <noscript>
        <div id="nojs">
          <p>
            <strong>OPTIMUS</strong> needs JavaScript to run.<br />
            Enable JavaScript and reload to play.
          </p>
        </div>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
